services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mediacon_hub
      POSTGRES_USER: mediacon
      POSTGRES_PASSWORD: mediacon_dev_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://mediacon:mediacon_dev_password@db:5432/mediacon_hub
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
