version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mediacon_hub
      POSTGRES_USER: mediacon
      POSTGRES_PASSWORD: mediacon_dev_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
volumes:
  db_data:
