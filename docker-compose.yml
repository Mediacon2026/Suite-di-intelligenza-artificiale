services:
  db:
    image: postgres:16
    container_name: mediacon_hub_db
    environment:
      POSTGRES_DB: mediacon_hub
      POSTGRES_USER: mediacon
      POSTGRES_PASSWORD: mediacon_dev_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediacon -d mediacon_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: mediacon_hub_backend
    environment:
      DATABASE_URL: postgresql+psycopg://mediacon:mediacon_dev_password@db:5432/mediacon_hub
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
    container_name: mediacon_hub_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  db_data:
